version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./orbit.db
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
      - KEYCLOAK_ISSUER_URL=http://keycloak:8080/realms/orbit-hub
      - KEYCLOAK_CLIENT_ID=orbit-hub-frontend
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=sqlite
      - KEYCLOAK_DEFAULT_REALM=orbit-hub
      - KEYCLOAK_HOSTNAME=keycloak
      - KEYCLOAK_HTTP_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  backend-data:
